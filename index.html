        }
        body {

            background-color: #ffffff;
            color: #333;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;

        /* الشريط الأخضر العلوي */
        .top-bar {
            background-color: #2e7d32;
            color: white;
            padding: 15px;

            align-items: center;

            padding: 30px 20px;
        }
        /* دائرة الشعار (أكياس التسوق) */
        .logo-circle {

            height: 110px;
            background-color: #25d36620;
            border-radius: 50%;

            justify-content: center;

        /* أيقونة الواتساب الدائرية الكبيرة */

            align-items: center;
            justify-content: center;
            width: 90px;
            height: 90px;
            background-color: #25D366;
            border-radius: 50%;
            margin: 0 auto 25px auto;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
            text-decoration: none;
            transition: transform 0.2s;
        }
        .whatsapp-icon-btn:active {
            transform: scale(0.95);
        }
        .whatsapp-icon-btn svg {
            width: 45px;
            height: 45px;
            fill: white;
        }
        .action-title {
            font-size: 22px;
            font-weight: bold;
            color: #111;
            margin-bottom: 10px;
        }
        .welcome-desc {

            line-height: 1.6;
            max-width: 450px;

            color: white;
            padding: 18px;

            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
            transition: background 0.3s;

            width: 100%;
        }
        .bottom-bar:hover {
